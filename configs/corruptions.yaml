# ============================================================================
# AegisBench corruption parameter table (canonical).
#
# Nine physically motivated corruptions, three severities each, organized by
# optical mechanism and mapped to disaster families:
#   flood      -> water_glare, turbidity_cast, inundation
#   wildfire   -> smoke_haze, fire_warm_tint
#   storm      -> rain_streaks, motion_blur, low_light
#   earthquake / post-disaster -> dust_haze (+ low_light, shared)
#
# Conventions
#   * Images are float32 RGB in [0, 1].
#   * All pixel-unit parameters (blur lengths, streak lengths, bloom sigmas)
#     are defined per 1000 px of max(H, W) and scaled at runtime, so the same
#     severity produces the same visual magnitude at any resolution.
#   * Every corruption is deterministic given (image_id, corruption, severity,
#     global_seed); see src/aegisbench/seeding.py.
#   * calibration.stat names the measurable image statistic that defines the
#     severity ladder; calibration.direction is the required monotonic trend
#     across severities 1 -> 3. Enforced by tests/test_corruptions.py and
#     scripts/phase3_calibrate.py.
# ============================================================================

global_seed: 20260707

corruptions:

  # ------------------------------------------------------------------ flood
  water_glare:
    family: flood
    description: >
      Specular sun-glint on standing floodwater. A thresholded low-frequency
      noise field forms glint cores that are screen-blended with a Gaussian
      bloom, saturating local pixels the way water glare saturates a sensor.
    calibration: {stat: saturated_fraction, direction: increasing}
    severities:
      1: {coverage: 0.03, intensity: 0.70, bloom_sigma_per_1000px: 8.0}
      2: {coverage: 0.08, intensity: 0.85, bloom_sigma_per_1000px: 12.0}
      3: {coverage: 0.18, intensity: 1.00, bloom_sigma_per_1000px: 16.0}
    fixed:
      glare_color_rgb: [1.00, 0.98, 0.92]
      noise_octaves: 4
      noise_base_res: 6

  turbidity_cast:
    family: flood
    description: >
      Muddy, sediment-laden water dominating the scene: global blend toward a
      mud chromaticity plus contrast compression toward the scene mean and
      saturation loss.
    calibration: {stat: rms_contrast, direction: decreasing}
    severities:
      1: {mud_alpha: 0.15, contrast_factor: 0.80, saturation_factor: 0.90}
      2: {mud_alpha: 0.30, contrast_factor: 0.62, saturation_factor: 0.75}
      3: {mud_alpha: 0.48, contrast_factor: 0.45, saturation_factor: 0.60}
    fixed:
      mud_color_rgb: [0.42, 0.33, 0.23]

  inundation:
    family: flood
    description: >
      Semi-transparent standing water partially occluding the scene. A smooth
      multi-octave noise mask selects the flooded fraction; inside it the
      image is alpha-blended with murky water, warped by a sinusoidal ripple
      displacement, and sprinkled with small specular sparkle.
    calibration: {stat: occluded_fraction, direction: increasing}
    # Ripple amplitude kept deliberately small: it displaces submerged
    # pixels but the fixed gt box is NOT warped to match, so amplitude is
    # bounded well below person scale to keep gt/pixel alignment tight.
    # At severity 3 on a 4000 px frame the max displacement is ~1.4 px.
    severities:
      1: {coverage: 0.20, opacity: 0.50, ripple_amp_per_1000px: 0.15}
      2: {coverage: 0.40, opacity: 0.65, ripple_amp_per_1000px: 0.25}
      3: {coverage: 0.60, opacity: 0.80, ripple_amp_per_1000px: 0.35}
    fixed:
      water_color_rgb: [0.35, 0.38, 0.30]
      ripple_wavelength_per_1000px: 60.0
      mask_feather_per_1000px: 15.0
      sparkle_intensity: 0.25
      noise_octaves: 3
      noise_base_res: 4

  # --------------------------------------------------------------- wildfire
  smoke_haze:
    family: wildfire
    description: >
      Wildfire smoke via the Koschmieder scattering model
      I = J * t + A * (1 - t) with neutral-gray airlight and a spatially
      varying transmission map (low-frequency noise), the dominant contrast
      killer in fire scenes.
    calibration: {stat: rms_contrast, direction: decreasing}
    severities:
      1: {t_mean: 0.70}
      2: {t_mean: 0.45}
      3: {t_mean: 0.25}
    fixed:
      airlight_rgb: [0.78, 0.78, 0.80]
      t_variation_amp: 0.15
      noise_octaves: 3
      noise_base_res: 3

  fire_warm_tint:
    family: wildfire
    description: >
      Fire-proximate illumination: white-balance shift toward orange
      (low-CCT firelight filtered through smoke) combined with a lighter,
      wispier warm-airlight haze (higher-octave transmission noise).
    calibration: {stat: red_blue_ratio, direction: increasing}
    severities:
      1: {r_gain: 1.08, b_gain: 0.92, t_mean: 0.85}
      2: {r_gain: 1.18, b_gain: 0.82, t_mean: 0.72}
      3: {r_gain: 1.30, b_gain: 0.70, t_mean: 0.58}
    fixed:
      airlight_rgb: [0.91, 0.62, 0.35]
      t_variation_amp: 0.25
      noise_octaves: 4
      noise_base_res: 5

  # ------------------------------------------------------------------ storm
  rain_streaks:
    family: storm
    description: >
      Heavy rain: additive elongated streaks with one coherent wind direction
      per image, over a rain veil (slight blur, desaturation, and overcast
      darkening) applied first.
    calibration: {stat: streak_density, direction: increasing}
    severities:
      1: {streaks_per_megapixel: 120, length_per_1000px: 12, veil_blur_sigma_per_1000px: 0.4, brightness_factor: 0.95, saturation_factor: 0.92}
      2: {streaks_per_megapixel: 350, length_per_1000px: 20, veil_blur_sigma_per_1000px: 0.8, brightness_factor: 0.88, saturation_factor: 0.85}
      3: {streaks_per_megapixel: 800, length_per_1000px: 30, veil_blur_sigma_per_1000px: 1.2, brightness_factor: 0.80, saturation_factor: 0.75}
    fixed:
      angle_mean_deg: 70.0
      angle_jitter_image_deg: 8.0
      angle_jitter_streak_deg: 3.0
      streak_intensity_range: [0.15, 0.45]

  motion_blur:
    family: storm
    description: >
      Wind-induced platform shake: linear motion blur with a single random
      direction per image, kernel length scaled to image size.
    calibration: {stat: edge_strength, direction: decreasing}
    severities:
      1: {kernel_len_per_1000px: 9}
      2: {kernel_len_per_1000px: 17}
      3: {kernel_len_per_1000px: 25}
    fixed: {}

  low_light:
    family: storm          # shared with earthquake / post-disaster response
    description: >
      Dusk / heavy-overcast exposure loss modeled in an approximately linear
      photometric domain (decode gamma 2.2): photon scaling, twilight
      blue-shift, and signal-dependent shot noise plus read noise whose
      relative magnitude grows as light falls.
    calibration: {stat: mean_luminance, direction: decreasing}
    severities:
      1: {linear_gain: 0.330, shot_noise_coef: 0.012, read_noise_sigma: 0.010}
      2: {linear_gain: 0.130, shot_noise_coef: 0.020, read_noise_sigma: 0.018}
      3: {linear_gain: 0.045, shot_noise_coef: 0.030, read_noise_sigma: 0.028}
    fixed:
      wb_r_gain: 0.92
      wb_b_gain: 1.06
      decode_gamma: 2.2

  # ------------------------------------- earthquake / post-disaster (dust)
  dust_haze:
    family: earthquake
    description: >
      Suspended dust and debris plume: Koschmieder scattering with a brown
      airlight (coarse mineral particles, unlike gray smoke), patchier
      higher-frequency transmission structure, and low-amplitude coarse
      granular noise from near-lens particulates.
    calibration: {stat: rms_contrast, direction: decreasing}
    severities:
      1: {t_mean: 0.65, grain_amp: 0.020}
      2: {t_mean: 0.42, grain_amp: 0.030}
      3: {t_mean: 0.24, grain_amp: 0.040}
    fixed:
      airlight_rgb: [0.70, 0.56, 0.38]
      t_variation_amp: 0.30
      noise_octaves: 5
      noise_base_res: 8
      grain_base_res: 220
