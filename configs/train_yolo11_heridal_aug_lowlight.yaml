# YOLOv11 fine-tune on HERIDAL tiles augmented with only the low_light
# corruption (Phase 6 mitigation, --strategy worst:low_light) -- targets
# the sweep's worst finding directly. Same budget as the clean baseline
# (configs/train_yolo11.yaml) so the comparison isolates the effect of
# the augmentation, not a training-recipe change.
#
# amp: false -- matches the aug_all config; disabled as a stability trial
# after two unrelated CUDA crashes on this machine's nightly-cu128
# Blackwell build. batch: 2, not 4 -- without AMP's fp16 memory savings,
# batch 4 at 1024px exceeded this card's 8GB VRAM and spilled into WSL's
# slow shared-memory fallback (observed live on the aug_all run: 10.3G
# reported GPU_mem on an 8151MiB card, ~10x slowdown per step).
kind: yolo11
run_name: yolo11_heridal_aug_lowlight
base_weights: yolo11m.pt
data_yaml: data/heridal/tiles_aug_lowlight/dataset.yaml
epochs: 80
imgsz: 1024
batch: 2
seed: 17
amp: false
optimizer: auto
lr0: 0.01
patience: 20
workers: 4
