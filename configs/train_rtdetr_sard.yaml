# RT-DETR-L fine-tune on clean SARD tiles. Same memory-hungry decoder
# budget as the HERIDAL run: batch 2 at 1024 px on 8 GB.
kind: rtdetr
run_name: rtdetr_sard_clean
base_weights: rtdetr-l.pt
data_yaml: data/sard/tiles/dataset.yaml
epochs: 80
imgsz: 1024
batch: 2
seed: 17
amp: true
optimizer: auto
lr0: 0.0001
patience: 20
workers: 4
